<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma educativa de exámenes de Grupo HDI">
  <title>Campus HDI · Exámenes</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="#/" class="brand" aria-label="Inicio Campus HDI">
        <img src="assets/logo.png" alt="Grupo HDI" class="brand-logo">
        <span class="brand-text">Campus<strong>HDI</strong></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Grupo HDI · Campus de formación</p>
      <p class="muted">Datos almacenados de forma segura en la nube.</p>
    </div>
  </footer>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <form method="dialog" class="modal-box" id="modalForm">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">&times;</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
  <script src="data.js?v=2.1"></script>
  <script src="app.js?v=2.1"></script>
</body>
</html>
